function pickVoice(){
 if(!('speechSynthesis' in window))return;
 const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));
 const rank=x=>{let r=0;const n=x.name;

function needUnlock(){if($('unl'))return;const d=document.createElement('div');d.id='unl';d.innerHTML='<button>🔊 اضغط لتفعيل الصوت</button>';
 d.firstChild.onclick=async()=>{try{await AC.resume()}catch(e){}d.remove();aud(AC.state==='running'?'🔊 الصوت شغال':'⚠ الصوت محجوب من المتصفح')};document.body.appendChild(d)}
/* ===== Subtitles + lip-sync ===== */
let subT=[],typT=[],talkT=null,curMood='evil',curAud=null,curSrc=null;
function clearSub(){subT.forEach(clearTimeout);typT.forEach(clearTimeout);subT=[];typT=[];const a=$('ar');if(a)a.textContent=''}
function typeSub(t,ms,ar){typT.forEach(clearTimeout);typT=[];$('ar').textContent=ar!==undefined?ar:(AR[t]||'');const el=$('say'),n=t.length,step=Math.max(18,Math.min(60,ms/n));let k=0;
 const tick=()=>{k=Math.min(n,k+1);el.textContent=t.slice(0,k);if(k<n)typT.push(setTimeout(tick,step))};tick()}
/* كل جملة تظهر لوحدها (هي وترجمتها) */
const SPLIT=/(?<=[.!?])\s+/;
function arPart(t,p,i,n){if(AR[p]!==undefined)return AR[p];if(n<2)return AR[t]||'';
 const a=(AR[t]||'').split(/(?<=[.!?؟])\s+/);return a.length===n?a[i]:(i===0?AR[t]||'':'')}
function subLines(t,ms){clearSub();const parts=t.split(SPLIT);
 if(parts.length<2){typeSub(t,ms);return}
 const tot=parts.reduce((x,p)=>x+p.length,0);let at=0;
 parts.forEach((p,i)=>{const d=ms*p.length/tot;subT.push(setTimeout(()=>typeSub(p,Math.max(200,d-120),arPart(t,p,i,parts.length)),at));at+=d})}
function talk(on){clearInterval(talkT);talkT=null;document.body.classList.toggle('talk',on);
 const mo=$('mouth');
 if(!on){mo.setAttribute('d',MO[curMood]||MO.evil);mo.style.fill=curMood==='laugh'?'#00ff41':'none';return}
 const open=['M70 152Q100 190 130 152Z','M72 154Q100 176 128 154Z','M66 156Q100 166 134 156','M74 150Q100 198 126 150Z'];
 talkT=setInterval(()=>{const d=open[Math.floor(Math.random()*open.length)];mo.setAttribute('d',d);mo.style.fill=d.endsWith('Z')?'#00ff41':'none'},120)}
function stopSpeech(){clearSub();talk(false);
 try{introA.pause();introA.currentTime=0}catch(e){}try{clipA.pause()}catch(e){}
 try{curSrc&&curSrc.stop()}catch(e){}if(curAud){try{curAud.pause()}catch(e){}curAud=null}
 if('speechSynthesis' in window)speechSynthesis.cancel();duck(false)}

/* Intro subtitles, timed to the pauses in the intro recording */
const INTRO_SUBS=[[0,"Nyehehe! Welcome, students of Menoufia National University!"],[5.29,"Your system is now completely in my grasp!"],[8.84,"Think you can escape? Ha ha ha!"],[11.6,"Show me what you've got, little humans!"]];
function introSubs(){clearSub();$('say').textContent='';
 INTRO_SUBS.forEach(([s,t],i)=>{const e=(INTRO_SUBS[i+1]?INTRO_SUBS[i+1][0]:14.2)-s-.3;subT.push(setTimeout(()=>typeSub(t,e*1000),s*1000))})}

/* Optional per-line recordings: voice/<key>.mp3 (ok1..ok6, no1..no6, late1..late2, win, lose) */
const KEY=new Map();
L.ok.forEach((s,i)=>KEY.set(s,'ok'+(i+1)));L.no.forEach((s,i)=>KEY.set(s,'no'+(i+1)));L.late.forEach((s,i)=>KEY.set(s,'late'+(i+1)));
KEY.set(L.win,'win');KEY.set(L.lose,'lose');
const VOICE_DIR='assets/audio/voice/';
const VOICE_FILES=['ok1','ok2','ok3','ok4','ok5','ok6','no1','no2','no3','no4','no5','no6','win','lose'];
const FP={},VOK=new Set(),VDEAD={};
function fileAudio(key){
 if(!VOICE_FILES.includes(key))return Promise.resolve(null);
 if(FP[key])return FP[key];
 FP[key]=(async()=>{let err='';
  for(let n=0;n<3;n++){
   try{const r=await fetch(VOICE_DIR+key+'.mp3');
    if(!r.ok)throw new Error('HTTP '+r.status);
    if(/text\/html/i.test(r.headers.get('content-type')||''))throw new Error('رجّع صفحة HTML (المسار غلط)');
    const a=new Audio(URL.createObjectURL(new Blob([await r.arrayBuffer()],{type:'audio/mpeg'})));a.preload='auto';a.dataset.key=key;
    await new Promise((res,rej)=>{a.onloadedmetadata=res;a.onerror=()=>rej(new Error('مش ملف صوت صالح'));setTimeout(res,6000)});
    VOK.add(key);return a}
   catch(e){err=String(e&&e.message||e);await sleep(600)}}
  VDEAD[key]=err;delete FP[key];return null})();
 return FP[key]}
async function playFile(a,t){
 duck(true);curAud=a;a.currentTime=0;
 try{await a.play()}catch(e){duck(false);curAud=null;throw e}
 subLines(t,(a.duration||3)*1000);talk(true);
 await new Promise(r=>{a.onended=r;setTimeout(r,((a.duration||8)+1)*1000)});
 talk(false);duck(false);curAud=null}

async function speak(t,mood){
 const key=KEY.get(t);
 if(voiceOn&&key){const a=await fileAudio(key);
  if(a){try{await playFile(a,t);return}catch(e){duck(false);talk(false)}}}
 if(clipOn&&voiceOn&&(t===L.intro||t===L.win||t===L.lose)){
  if(t!==L.intro){const sk=t===L.win?SEG.win:SEG.lose;clearSub();subLines(t,(sk[1]-sk[0])*1000)}
  talk(true);
  const sg=t===L.intro?SEG.intro:t===L.win?SEG.win:t===L.lose?SEG.lose:SEG.r[Math.floor(Math.random()*SEG.r.length)];
  try{
   await Promise.race([clipP,sleep(t===L.intro?12000:4000)]);
   if(bufC&&bufI){
    try{ if(t===L.intro){introSubs();await playBuf(bufI)}else await playBuf(bufC,sg[0],sg[1]);return }
    catch(e){ if(e.message==='audio-blocked'){needUnlock();aud('⚠ المتصفح حاجب الصوت');await sleep(1500)} else throw e }
   }
   if(t===L.intro){introSubs();duck(true);try{await introA.play()}catch(e){duck(false);throw e}
    await new Promise(r=>{introA.onended=r;setTimeout(r,20000)});duck(false);return}
   await playSeg(sg[0],sg[1]);return
  }catch(e){aud('⚠ '+(e&&e.message||e));clipOn=false}
  finally{talk(false)}}
 clearSub();
 if(!voiceOn||!('speechSynthesis' in window)){const ms=Math.min(6000,900+t.length*45);subLines(t,ms);await sleep(ms);return}
 speechSynthesis.cancel();duck(true);drone();talk(true);
 const parts=t.split(SPLIT);
 for(let i=0;i<parts.length;i++){const p=parts[i];
  typeSub(p,Math.max(600,p.length*55),arPart(t,p,i,parts.length));
  const t1=performance.now();await say1(p,mood);const need=Math.min(3500,500+p.length*50),el=performance.now()-t1;if(el<need)await sleep(need-el);
  if(i<parts.length-1)await sleep(mood==='evil'?420:180)}
 talk(false);duck(false);
}

/* ===== Music + SFX (WebAudio, no files needed) ===== */
let AC=null,master,musicOn=true,sched=null,step=0,nextT=0,bar=0,ducked=false;
const BPM=134,SD=60/BPM/4,roots=[55,43.65,49,41.2];
function initAudio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.3;master.connect(AC.destination);loadClips()}
function vol(){if(!AC)return;master.gain.setTargetAtTime(musicOn?(ducked?.05:.3):0,AC.currentTime,.05)}
function duck(b){ducked=b;vol()}
function tone(f,t,d,type,v,cut){const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();
 o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=cut||1500;
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(fl);fl.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);
 g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(master);o.start(t);o.stop(t+.22)}
function hat(t){const n=AC.sampleRate*.05,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;s.buffer=b;
 g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f);f.connect(g);g.connect(master);s.start(t)}
const arp=[1,1.2,1.5,2,1.5,1.2,1,0.75];
function play(t){
 const r=roots[bar%4];
 if(step%4===0)kick(t);
 if(step%2===1)hat(t);
 if(step%2===0||step%8===7)tone(r,t,SD*1.6,'sawtooth',.35,300+(bar%4)*80);
 tone(r*8*arp[step%8],t,SD*.9,'square',.07,2200);
 if(step===0&&bar%4===3)tone(r*16,t,SD*8,'sawtooth',.05,1200);
 step++;if(step>=16){step=0;bar++}
}
function startMusic(){initAudio();if(AC.state==='suspended')AC.resume();if(sched)return;nextT=AC.currentTime+.1;
 sched=setInterval(()=>{while(nextT<AC.currentTime+.2){play(nextT);nextT+=SD}},50)}
function stopMusic(){clearInterval(sched);sched=null}
function laugh(t){for(let k=0;k<5;k++){const tt=t+k*.19,o=AC.createOscillator(),g=AC.createGain(),b=AC.createBiquadFilter(),lf=AC.createOscillator(),lg=AC.createGain();
 o.type='sawtooth';o.frequency.setValueAtTime(360-k*14,tt);o.frequency.exponentialRampToValueAtTime(250-k*10,tt+.15);
 lf.frequency.value=38;lg.gain.value=22;lf.connect(lg);lg.connect(o.frequency);
 b.type='bandpass';b.frequency.value=900;b.Q.value=2.5;
 g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(.5,tt+.02);g.gain.exponentialRampToValueAtTime(.001,tt+.16);
 o.connect(b);b.connect(g);g.connect(master);o.start(tt);o.stop(tt+.2);lf.start(tt);lf.stop(tt+.2)}}
function growl(t){const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(55,t+.6);
 f.type='lowpass';f.frequency.value=700;g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.65);o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+.7)}
function sfx(ok){if(!AC)return;const t=AC.currentTime;
 if(ok){[523,659,784,1046].forEach((f,i)=>tone(f,t+i*.07,.2,'triangle',.25,4000));growl(t+.3)}
 else{tone(140,t,.4,'sawtooth',.4,600);if(!clipOn)laugh(t+.15)}}

/* ===== Avatar ===== */
const MO={evil:'M66 156Q100 176 134 150',laugh:'M62 148Q100 204 138 148Z',angry:'M66 172Q100 148 134 172',defeat:'M70 174Q100 150 130 174'};
function face(m){curMood=m;document.body.classList.remove('angry','laugh');
 const mo=$('mouth');mo.setAttribute('d',MO[m]||MO.evil);mo.style.fill=m==='laugh'?'#00ff41':'none';
 const a=m==='angry';$('brL').setAttribute('d',a?'M50 90L90 76':'M52 78L88 90');$('brR').setAttribute('d',a?'M150 90L110 76':'M148 78L112 90');

/* QR أولاً قبل Firebase */
(function(){const u=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'');
 const l=document.getElementById('lnk');
 if(location.protocol==='file:'){l.textContent='⚠ الصفحة مفتوحة من الجهاز مباشرة. ارفعها أونلاين وافتحها من الرابط.';l.style.color='#ff1f3d'}
 else l.textContent=u;

const NOWRONG=[L.no[1],L.no[2],L.no[4]];
/* ===== Kahoot mode (Firebase) ===== */
firebase.initializeApp(firebaseConfig);const GR=firebase.database().ref('game');
const DUR=20;let hk=100,cur=-1,state='lobby',off=0,t0=0,tm=null,P={},tc=0,ta=0,gen=0;
firebase.database().ref('.info/serverTimeOffset').on('value',s=>off=s.val()||0);
const now=()=>Date.now()+off;
GR.set({state:'lobby',rev:firebase.database.ServerValue.TIMESTAMP});

function board(box,n){box.textContent='';sorted().slice(0,n).forEach((p,k)=>{
 const d=document.createElement('div'),a=document.createElement('span'),c=document.createElement('b');
 a.textContent=(k+1)+'. '+p.name+(state==='reveal'&&p.gain?'  (+'+p.gain+')':'');c.textContent=p.score||0;d.append(a,c);box.appendChild(d)})}

$('start').onclick=async()=>{
 if(!Object.keys(P).length)return alert('مفيش لاعبين لسه');
 initAudio();try{AC.resume()}catch(e){}if(musicOn)startMusic();[...KEY.values()].forEach(fileAudio);
 gen++;const g=gen;tc=ta=0;hk=100;state='intro';GR.update({state:'intro',rev:firebase.database.ServerValue.TIMESTAMP});
 $('tot').textContent=Q.length;$('h').textContent=100;show('game');face('evil');
 $('opts').innerHTML='';$('q').textContent='...جاري الاختراق';$('tb').classList.add('hide');$('lbp').classList.add('hide');
 await speak(L.intro,'evil');if(g!==gen)return;ask(0)};
function ask(i){cur=i;state='question';const it=Q[i];t0=now();face('evil');clearSub();$('say').textContent='...';
 GR.update({state:'question',rev:firebase.database.ServerValue.TIMESTAMP,cur:{i,q:it.q,o:it.o,start:firebase.database.ServerValue.TIMESTAMP,dur:DUR}});
 $('n').textContent=i+1;$('q').textContent=it.q;$('s').textContent='0/'+Object.keys(P).length;
 const o=$('opts');o.textContent='';it.o.forEach((t,k)=>{const d=document.createElement('div');d.className='o c'+k;d.textContent=t;o.appendChild(d)});
 $('lbp').classList.add('hide');$('tb').classList.remove('hide');clearInterval(tm);
 tm=setInterval(()=>{const l=DUR-(now()-t0)/1000;$('tf').style.width=Math.max(0,l/DUR*100)+'%';if(l<=0)reveal()},100)}
function reveal(){if(state!=='question')return;state='reveal';clearInterval(tm);const it=Q[cur],up={};let ans=0,ok=0;
 for(const[id,p]of Object.entries(P)){const a=p.ans;let g=0;
  if(a&&a.q===cur){ans++;if(a.k===it.c){ok++;g=Math.round(1000*(1-Math.min(Math.max(a.ts?a.ts-t0:a.t,0),DUR*1000)/(DUR*1000)/2))}}
  up['players/'+id+'/score']=(p.score||0)+g;up['players/'+id+'/gain']=g;up['players/'+id+'/lastq']=cur}
 Object.keys(P).map(id=>[id,up['players/'+id+'/score']]).sort((x,y)=>y[1]-x[1]).forEach((e,i)=>up['players/'+e[0]+'/rank']=i+1);
 up.state='reveal';up.rev=firebase.database.ServerValue.TIMESTAMP;up['cur/c']=it.c;GR.update(up);
 tc+=ok;ta+=Object.keys(P).length;
 [...$('opts').children].forEach((d,k)=>d.classList.add(k===it.c?'win':'dim'));
 const right=ans>0&&ok/ans>=.5;if(right)hk=Math.max(0,hk-10);$('h').textContent=hk;flash(right?'ok':'no');sfx(right);face(right?'angry':'laugh');
 speak(right?R(L.ok):R(NOWRONG),right?'angry':'laugh');
 $('nx').textContent=cur+1<Q.length?'التالي ▶':'النتيجة النهائية ▶';$('lbp').classList.remove('hide')}

 const pct=Math.round(tc/Math.max(ta,1)*100),won=pct>=50;show('end');face(won?'defeat':'laugh');
